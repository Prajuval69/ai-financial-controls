[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "financial-audit-ai"
version = "1.0.0"
description = "Synthetic AI-driven financial controls and audit analytics engine"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "matplotlib>=3.8",
  "numpy>=1.26",
  "pandas>=2.1",
  "pydantic>=2.6",
  "PyYAML>=6.0",
  "scikit-learn>=1.4",
  "scipy>=1.11",
  "streamlit>=1.33",
  "uvicorn>=0.27",
]

[project.optional-dependencies]
dev = ["httpx>=0.27", "pytest>=8.0", "ruff>=0.5"]

[project.scripts]
financial-audit-pipeline = "financial_audit_ai.pipeline:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

